<head>
  <meta charset="UTF-8">
  <title>kumo's doc</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 自定义Gitalk样式，匹配橙色主题 */
    .gt-container * {
      -webkit-box-sizing: border-box !important;
      box-sizing: border-box !important;
    }
    .gt-container .gt-btn:not(.gt-btn-preview) {
      border-color: orange !important;
      background-color: orange !important;
      color: white !important;
    }
    .gt-container .gt-btn:not(.gt-btn-preview):hover {
      border-color: darkorange !important;
      background-color: darkorange !important;
    }
    .gt-container .gt-header-controls .gt-btn {
      border-color: orange !important;
      background-color: orange !important;
      color: white !important;
    }
    .gt-container .gt-header-controls .gt-btn:hover {
      border-color: darkorange !important;
      background-color: darkorange !important;
    }
    .gt-container .gt-btn.gt-btn-preview {
      background-color: white !important;
      color: orange !important;
      border-color: orange !important;
    }
    .gt-container .gt-btn.gt-btn-preview:hover {
      background-color: #f5f5f5 !important;
      color: orange !important;
      border-color: orange !important;
    }
    .gt-container .gt-comment-username {
      color: orange !important;
    }
    .gt-container .gt-action {
      color: orange !important;
    }
    .gt-container .gt-action:hover {
      color: darkorange !important;
    }
    .gt-container .gt-svg svg {
      fill: orange !important;
    }
    .gt-container .gt-ico-text {
      color: orange !important;
    }
    .gt-container .gt-link {
        border-bottom: 1px dotted orange !important;
    }
    .gt-container .gt-popup .gt-action.is--active:before {
        content: '';
        width: 0.25em;
        height: 0.25em;
        background: orange !important;
        position: absolute;
        left: 0.5em;
        top: 0.4375em;
    }
    .gt-container a {
        color: orange !important;
    }
  </style>
</head>

<body>
  <div id="app"></div>
</body>
  <script>
    window.$docsify = {
      themeColor: "orange",
      homepage: "readme.md",
      loadSidebar: true,
      subMaxLevel: 2,
      loadNavbar: true,
      count: {
        countable: true, fontsize: '0.9em', color: 'rgb(90,90,90)', language: 'chinese'
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'material', 
        tabComments: true, 
        tabHeadings: true
      },
      search: {
        maxAge: 86400000,
        paths: [],
        placeholder: 'Type to search',
        noData: 'No Results!',
        depth: 2,
        hideOtherSidebarContent: true,
      },
    };
  </script>
  <!-- Docsify v4 -->
  <!-- 字数统计 -->
  <script src="https://unpkg.com/docsify-count/dist/countable.js"></script>
  <!-- 上下篇章 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 代码块复制到剪切板 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/gitalk/dist/gitalk.css" />
  <!-- tabs -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <!-- gitalk -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/gitalk.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gitalk/dist/gitalk.min.js"></script>
  <!-- search -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script>
    // 跟踪当前ID
    let currentId = (() => {
      const hashPath = location.hash.split('?')[0];
      const match = hashPath.match(/#\/([^\/]+)/);
      return match ? match[1] : 'readme';
    })();
    
    const gitalk = new Gitalk({
      clientID: 'Ov23liuMK4WFpjUI5zeQ',
      clientSecret: 'ff9bc6f3f637ae3aeb908f211068cb67b2907c16',
      repo: 'ltd',
      owner: 'kumoSleeping',
      admin: [
        'kumoSleeping',
      ],
      // facebook-like distraction free mode
      distractionFreeMode: false,
      // 使用markdown文件标题(可以是数字或文字)
      id: currentId,
      // 设置一个简单的标题
      title: location.pathname + location.hash,
      // 设置标签
      labels: ['gitalk'],
    });
    
    // 在 Gitalk 渲染完成后添加空白 div
    const addSpacingAfterGitalk = () => {
      setTimeout(() => {
        const gitalkContainer = document.getElementById('gitalk-container');
        if (gitalkContainer && !gitalkContainer.nextElementSibling?.classList.contains('gitalk-spacing')) {
          const spacingDiv = document.createElement('div');
          spacingDiv.className = 'gitalk-spacing';
          spacingDiv.style.height = '100px';
          spacingDiv.style.display = 'flex';
          spacingDiv.style.alignItems = 'center';
          spacingDiv.style.justifyContent = 'center';
          spacingDiv.innerHTML = '<p style="text-align: center; color: gray; font-size: 0.9em;">© 2025 kumoSleeping. | Use Github Issues for feedback.</p>';
          gitalkContainer.parentNode.insertBefore(spacingDiv, gitalkContainer.nextSibling);
        }
      }, 0); // 延迟1秒，确保 Gitalk 完全加载
    };
    
    // 初始加载时添加间距
    addSpacingAfterGitalk();
    
    // 监听hashchange来重新初始化Gitalk
    window.addEventListener('hashchange', function() {
      setTimeout(() => {
        const newId = (() => {
          const hashPath = location.hash.split('?')[0];
          const match = hashPath.match(/#\/([^\/]+)/);
          return match ? match[1] : 'readme';
        })();
        
        if (newId !== currentId) {
          console.log(`Gitalk ID changed from '${currentId}' to '${newId}'`);
          currentId = newId;
          
          const container = document.getElementById('gitalk-container');
          if (container) {
            container.innerHTML = '';
            const newGitalk = new Gitalk({
              clientID: 'Ov23liuMK4WFpjUI5zeQ',
              clientSecret: 'ff9bc6f3f637ae3aeb908f211068cb67b2907c16',
              repo: 'ltd',
              owner: 'kumoSleeping',
              admin: ['kumoSleeping'],
              distractionFreeMode: false,
              id: newId,
              title: location.pathname + location.hash,
              labels: ['gitalk'],
            });
            newGitalk.render('gitalk-container');
            // 重新添加间距
            addSpacingAfterGitalk();
          }
        } else {
          console.log(`Gitalk ID remains '${currentId}', no change`);
        }
      }, 0); // 延迟200ms，确保Docsify更新完毕
    });
  </script>

</body>

</html>
